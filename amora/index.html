<style>
/* Amora — one shop, and a few pieces of frosted glass drifting over it.
   Type: Boska for names and headings, DM Sans for everything you read or press.
   Nothing is boxed: flowers float on soft halos of their own colour, buttons are light, edges are glass. */
:root {
  color-scheme: light;
  --plum: #2E1729;
  --ink-soft: #66505F;
  --cream: #FFF8EE;
  --gold: #D2A967;
  --gold-light: #F3DBAE;
  --rose: #A93F66;
  --blush: #F7C7D0;
  --hair: rgba(46, 23, 41, .08);
  --display: 'Boska', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --sans: 'DM Sans', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --ease: cubic-bezier(.22, .8, .24, 1);
  --pad: clamp(14px, 2.4vw, 32px);
  --bar: 0px;                                   /* room the storefront keeps clear at the top (read by world.js) */
  --top: calc(var(--pad) + 46px + 14px);        /* where a pane starts, clear of the two buttons in the corner */
  --glass: linear-gradient(135deg, rgba(255, 255, 255, .5) 0%, rgba(255, 255, 255, .1) 45%, rgba(255, 255, 255, .22) 100%), linear-gradient(155deg, rgba(253, 223, 232, .84) 0%, rgba(242, 226, 247, .8) 50%, rgba(255, 234, 218, .82) 100%);
  --glass-edge: rgba(255, 255, 255, .7);
  --ink: #3A1030;
  --blur: blur(22px) saturate(1.6) brightness(1.05);
  --lift: inset 0 1px 0 rgba(255, 255, 255, .9), 0 14px 34px -16px rgba(74, 26, 52, .5);
  --shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 30px 70px -26px rgba(74, 26, 52, .5), 0 2px 10px rgba(74, 26, 52, .05);
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
body { margin: 0; min-height: 100%; background: #EFC3B4; color: var(--plum); font-family: var(--sans); font-weight: 400; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body.is-locked { overflow: hidden; }
h1, h2, h3, p, ul, dl, dd, dt { margin: 0; padding: 0; }
ul { list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid rgba(169, 63, 102, .75); outline-offset: 3px; }
[tabindex="-1"]:focus { outline: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.track { height: 900vh; }
.stage { position: fixed; inset: 0; overflow: hidden; user-select: none; -webkit-user-select: none; background: #EFC3B4 var(--img-facade-jpg) center top / cover; }
.stage__gl { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: pan-y; display: block; opacity: 0; transition: opacity 1.1s ease; }
body.is-open .stage__gl { opacity: 1; }
.stage__grade { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(125% 95% at 50% 46%, rgba(0, 0, 0, 0) 58%, rgba(40, 16, 24, .3) 100%); }
body.no-gl .stage { background: var(--img-facade-jpg) center / cover; }
body.no-gl .stage__gl, body.no-gl .doorspot { display: none; }
.veil { position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 44%, #FFF8E8, #F8DDBC 70%, #F1C9A8); transition: opacity .75s ease; }
.veil.is-on { opacity: 1; }

/* a pane of frosted glass: shared by everything that floats */
.hint, .tag, .card, .nogl, .moods { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--glass-edge); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .hint, .tag, .card, .nogl, .moods { background: rgba(255, 250, 246, .96); }
}

/* ---------- buttons: clear glass, a fine bright edge, almost no shadow ---------- */
.btn, .float, .x, .music, .stepper, .doorspot span, .heart, .finds {
  color: var(--ink); border: 1px solid rgba(255, 255, 255, .8);
  background: linear-gradient(180deg, rgba(255, 255, 255, .74) 0%, rgba(255, 255, 255, .46) 100%);
  -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .95), 0 6px 14px -10px rgba(58, 16, 48, .35);
}
.btn, .float, .x, .music, .heart { position: relative; isolation: isolate; transition: transform .5s var(--ease), background .4s, border-color .4s, opacity .3s; }
/* on hover a single band of light crosses the glass */
.btn::before, .float::before { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; background: linear-gradient(105deg, rgba(255, 255, 255, 0) 42%, rgba(255, 255, 255, .85) 50%, rgba(255, 255, 255, 0) 58%) 160% 0 / 260% 100% no-repeat; transition: background-position 1s var(--ease); }
.btn:hover::before, .float:hover::before { background-position: -60% 0; }
.btn:hover, .float:hover, .x:hover, .music:hover, .heart:hover { transform: translateY(-1px); border-color: #fff; background: linear-gradient(180deg, rgba(255, 255, 255, .88) 0%, rgba(255, 255, 255, .62) 100%); }
.btn:active, .float:active { transform: translateY(0) scale(.985); }
.btn svg, .float svg, .music svg { flex: none; color: var(--rose); transition: transform .6s var(--ease); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 50px; padding: 0 28px; border-radius: 999px; font-family: var(--sans); font-size: .96rem; font-weight: 600; letter-spacing: .015em; line-height: 1.1; white-space: nowrap; }
.btn .spark { color: var(--gold); }
.btn:hover svg { transform: rotate(90deg); }
.btn--sm { min-height: 40px; padding: 0 17px 0 13px; font-size: .88rem; gap: 6px; }
.btn--big { min-height: 54px; padding: 0 32px; font-size: 1rem; }
.btn.is-added { animation: added .6s var(--ease); }
@keyframes added { 40% { transform: scale(1.08); } }
.btn.is-added svg { transform: rotate(45deg); color: var(--gold); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.x { width: 46px; height: 46px; flex: none; border-radius: 50%; }
.x::before, .x::after { content: ''; position: absolute; left: 16px; right: 16px; top: 50%; height: 1.4px; margin-top: -.7px; background: var(--rose); transition: transform .6s var(--ease); }
.x::before { transform: rotate(45deg); } .x::after { transform: rotate(-45deg); }
.x:hover::before { transform: rotate(135deg); } .x:hover::after { transform: rotate(45deg); }
.stepper { display: inline-flex; align-items: center; border-radius: 999px; }
.stepper button { width: 36px; height: 36px; font-size: 1.15rem; line-height: 1; border-radius: 50%; color: var(--rose); transition: background .25s; }
.stepper button:hover { background: rgba(255, 255, 255, .75); }
.stepper output { min-width: 22px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }

/* a flower's own glow, in the colour of its cube */
.halo { position: relative; display: grid; place-items: end center; background: radial-gradient(62% 56% at 50% 60%, color-mix(in srgb, var(--c, #F7C7D0) 62%, #fff) 0%, color-mix(in srgb, var(--c, #F7C7D0) 26%, transparent) 58%, transparent 76%); }
.halo::after { content: ''; position: absolute; left: 24%; right: 24%; bottom: 2%; height: 9%; border-radius: 50%; background: radial-gradient(closest-side, rgba(74, 26, 52, .16), rgba(74, 26, 52, 0)); }
.halo img { position: relative; z-index: 1; object-fit: contain; object-position: bottom; filter: drop-shadow(0 12px 12px rgba(74, 26, 52, .16)); }

/* ---------- top right: the flowers, the basket ---------- */
.corner { position: absolute; top: var(--pad); right: var(--pad); z-index: 8; display: flex; gap: 10px; opacity: 0; transform: translateY(-6px); transition: opacity .9s ease .3s, transform .9s var(--ease) .3s; }
body.is-open .corner, body.is-open .music { opacity: 1; transform: none; }
.float { display: inline-flex; align-items: center; gap: 9px; min-height: 46px; padding: 0 20px 0 16px; border-radius: 999px; font-size: .94rem; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.float--basket { padding-right: 9px; }
.float__bk { width: 30px; height: auto; margin: 0 -2px 0 -4px; filter: drop-shadow(0 2px 2px rgba(92, 36, 64, .3)); }
.float--basket b { position: relative; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; background: var(--rose); color: #fff; font-size: .76rem; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.float--basket b.is-bump { animation: bump .7s var(--ease); }
@keyframes bump { 40% { transform: scale(1.35); } }

/* ---------- bottom left: the music ---------- */
.music { position: absolute; left: var(--pad); bottom: var(--pad); z-index: 8; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: var(--rose); opacity: 0; }
body.is-open .music { transition: opacity .9s ease .5s, transform .5s var(--ease), box-shadow .5s var(--ease); }
.music .bars { display: none; align-items: flex-end; gap: 3px; height: 16px; }
.music .bars i { width: 3px; height: 5px; border-radius: 2px; background: currentColor; animation: eq 1.2s ease-in-out infinite; }
.music .bars i:nth-child(2) { animation-delay: -.45s; } .music .bars i:nth-child(3) { animation-delay: -.9s; } .music .bars i:nth-child(4) { animation-delay: -.25s; }
@keyframes eq { 0%, 100% { height: 4px; } 50% { height: 16px; } }
.music[aria-pressed="true"] svg { display: none; }
.music[aria-pressed="true"] .bars { display: flex; }
body.no-gl .music { bottom: auto; top: var(--pad); left: var(--pad); }

/* ---------- only when the browser cannot draw the shop ---------- */
.nogl { position: absolute; left: 50%; bottom: var(--pad); transform: translateX(-50%); z-index: 5; width: min(520px, calc(100% - 2 * var(--pad))); display: grid; gap: 14px; justify-items: start; padding: 22px 26px; border-radius: 30px; box-shadow: var(--shadow); font-size: 1rem; }
.nogl__name { font-family: var(--display); font-weight: 700; font-size: 1.7rem; line-height: 1; }
.nogl__name em { font-weight: 500; font-size: 1.15rem; color: var(--rose); margin-left: 8px; }

/* ---------- the doors ---------- */
.doorspot { position: absolute; left: 0; top: 0; z-index: 4; display: grid; justify-items: center; gap: 10px; padding: 8px; will-change: transform; }
.doorspot i { width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid rgba(255, 248, 238, .9); background: rgba(255, 248, 242, .18); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); position: relative; box-shadow: 0 0 0 0 rgba(255, 248, 238, .6); animation: ping 2.6s ease-out infinite; transition: background .4s; }
.doorspot i::before { content: ''; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -6px 0 0 -7px; border: solid #fff; border-width: 1.8px 1.8px 0 0; transform: rotate(45deg); }
.doorspot--exit i::before { transform: rotate(-135deg); margin: -4px 0 0 -3px; }
@keyframes ping { 70%, 100% { box-shadow: 0 0 0 24px rgba(255, 248, 238, 0); } }
.doorspot span { padding: 9px 20px; border-radius: 999px; font-size: .9rem; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.doorspot:hover i { background: rgba(255, 248, 242, .4); }

/* ---------- inside ---------- */
.hint { position: absolute; left: 50%; bottom: calc(var(--pad) + 4px); transform: translateX(-50%); z-index: 4; padding: 11px 22px; border-radius: 999px; color: var(--plum); font-size: .92rem; font-weight: 500; box-shadow: var(--lift); text-align: center; max-width: calc(100vw - 140px); text-wrap: balance; animation: rise .8s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 12px); } }
.tag { position: absolute; z-index: 6; pointer-events: none; transform: translate(-50%, calc(-100% - 20px)); padding: 9px 18px 10px; border-radius: 20px; text-align: center; white-space: nowrap; box-shadow: var(--lift); }
.tag strong { display: block; font-family: var(--display); font-weight: 700; font-size: 1.22rem; line-height: 1.15; }
.tag span { font-size: .84rem; font-weight: 500; color: var(--ink-soft); }
.keys { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; }

/* ---------- the flower card ---------- */
.card { position: absolute; left: 50%; bottom: var(--pad); transform: translateX(-50%); z-index: 9; width: min(530px, calc(100vw - 24px)); display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 4px 20px; align-items: center; padding: 18px 22px 20px 12px; border-radius: 36px; box-shadow: var(--shadow); animation: card-in .7s var(--ease); }
@keyframes card-in { from { opacity: 0; transform: translate(-50%, 26px) scale(.97); filter: blur(4px); } }
.card .x { position: absolute; right: 12px; top: 12px; }
.card img { width: 130px; height: 158px; object-fit: contain; object-position: bottom; border-radius: 30px; background: radial-gradient(60% 52% at 50% 62%, color-mix(in srgb, var(--c, #F7C7D0) 60%, #fff) 0%, color-mix(in srgb, var(--c, #F7C7D0) 22%, transparent) 60%, transparent 78%); filter: drop-shadow(0 12px 14px rgba(74, 26, 52, .16)); animation: bob 5s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.card h2 { font-family: var(--display); font-weight: 700; font-size: clamp(1.7rem, 3vw, 2.1rem); line-height: 1.08; padding-right: 92px; letter-spacing: -.01em; }
.card__line { margin-top: 4px; font-size: 1rem; font-weight: 500; }
.card__means { margin-top: 5px; font-family: var(--display); font-style: italic; font-weight: 500; font-size: 1.04rem; line-height: 1.25; color: var(--rose); }
.card__note { font-size: .9rem; color: var(--ink-soft); margin: 4px 0 14px; }
.card__note .find { margin: 0 0 0 6px; }
.card .heart { position: absolute; right: 64px; top: 15px; }
.card__row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.card__row .btn { flex: 1 1 auto; min-height: 46px; padding: 0 20px; }

/* ---------- the glass: one material for both panes ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(30, 8, 22, .3); animation: fade .5s ease; }
@keyframes fade { from { opacity: 0; } }
/* It sits below the two corner buttons, never over them. A deep blur of the shop, a milky tint that is brighter where the
   light falls (top left), a whisper of grain, a rim that catches the light at two corners, and one soft shadow. */
.glass { position: fixed; z-index: 30; inset: var(--top) 20px 20px; margin: auto; border-radius: 40px; overflow: hidden; isolation: isolate; color: var(--plum);
  background: var(--img-grain-png), linear-gradient(145deg, rgba(255, 255, 255, .8) 0%, rgba(255, 253, 254, .58) 46%, rgba(255, 253, 254, .66) 100%);
  -webkit-backdrop-filter: blur(48px) saturate(1.3) brightness(1.16); backdrop-filter: blur(48px) saturate(1.3) brightness(1.16);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, .95), inset 0 -1px 1px rgba(255, 255, 255, .35), inset 0 0 44px rgba(255, 255, 255, .22), 0 0 0 1px rgba(40, 12, 30, .05), 0 36px 70px -40px rgba(30, 8, 22, .55);
  animation: glass-in .6s var(--ease); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: rgba(255, 251, 250, .96); } }
@keyframes glass-in { from { opacity: 0; transform: translateY(14px) scale(.985); } }
/* the rim: bright where light enters, almost gone along the sides, bright again where it leaves */
.glass::before { content: ''; position: absolute; inset: 0; z-index: 5; border-radius: inherit; padding: 1.2px; pointer-events: none;
  background: linear-gradient(140deg, #fff 0%, rgba(255, 255, 255, .5) 22%, rgba(255, 255, 255, .14) 46%, rgba(255, 255, 255, .14) 62%, rgba(255, 255, 255, .8) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
/* light pooling in the top left corner, and a faint return at the bottom right */
.glass::after { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(70% 60% at 0% 0%, rgba(255, 255, 255, .5), rgba(255, 255, 255, 0) 62%), radial-gradient(50% 44% at 100% 100%, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 66%); }


/* ---------- the real basket: your flowers stand in it ---------- */
.bq { position: relative; display: block; aspect-ratio: 100 / 128; }
.bq__glow { position: absolute; left: -6%; right: -6%; top: 10%; bottom: 8%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, .5), rgba(255, 255, 255, 0) 72%); }
.bq__shadow { position: absolute; left: 14%; right: 14%; bottom: -2.5%; height: 6%; border-radius: 50%; background: radial-gradient(closest-side, rgba(58, 16, 48, .22), rgba(58, 16, 48, 0)); }
.bq__stems { position: absolute; inset: 0; }
.bq__f { position: absolute; height: auto; max-width: none; transform-origin: 50% 100%; transform: rotate(var(--r)); filter: drop-shadow(0 3px 5px rgba(58, 16, 48, .14)); }
.bq__f.is-new { animation: stem-in 1s var(--ease) both; animation-delay: calc(var(--i) * 110ms + 150ms); }
@keyframes stem-in { from { opacity: 0; transform: translateY(-36%) rotate(calc(var(--r) * 1.9)) scale(.88); } 55% { opacity: 1; } }
.bq__basket { position: absolute; bottom: 0; height: auto; z-index: 3; filter: drop-shadow(0 8px 10px rgba(58, 16, 48, .16)); }
.bq--big { width: min(286px, 25vw, 35vh); }
.bq.is-empty { aspect-ratio: 100 / 76; }
.bq--mini { width: 92px; }
.bq--mini .bq__f, .bq--mini .bq__basket { filter: drop-shadow(0 3px 4px rgba(92, 36, 64, .25)); }

/* ---------- all flowers: the same pane of glass; each flower stands in a small arch of tinted glass ---------- */
.reel { width: min(1180px, calc(100vw - 40px)); height: min(730px, calc(100vh - var(--top) - 20px)); display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; --gut: clamp(22px, 4vw, 52px); }
.reel__head { display: flex; align-items: center; gap: clamp(12px, 2vw, 24px); padding: 20px 20px 0 var(--gut); }
.reel__head h2 { margin-right: auto; font-family: var(--display); font-weight: 500; font-size: clamp(2.2rem, 3.6vw, 3rem); line-height: 1; letter-spacing: -.015em; }
.peek { position: relative; display: flex; align-items: flex-end; gap: 10px; padding: 0 6px 2px; border-radius: 24px; outline-offset: 6px; transition: transform .5s var(--ease); }
.peek:hover { transform: translateY(-2px); }
.peek__label { padding-bottom: 6px; font-family: var(--display); font-style: italic; font-weight: 500; font-size: 1.1rem; color: var(--rose); white-space: nowrap; }
.peek b { position: absolute; right: -2px; bottom: 0; z-index: 4; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; display: grid; place-items: center; background: var(--rose); color: #fff; font-size: .76rem; font-weight: 600; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 2px rgba(255, 255, 255, .8); }
.reel__track { --w: clamp(200px, 17vw, 236px); display: flex; align-items: center; gap: clamp(20px, 2.6vw, 38px); overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-padding-inline: var(--gut); padding: 0 var(--gut); scrollbar-width: none; outline-offset: -6px; }
.reel__track::-webkit-scrollbar { display: none; }
.bloom { flex: 0 0 var(--w); scroll-snap-align: start; text-align: center; }
.bloom__in { display: grid; justify-items: center; animation: tile-in .9s var(--ease) both; animation-delay: calc(min(var(--n), 6) * 80ms + 140ms); }
@keyframes tile-in { from { opacity: 0; transform: translateY(26px); } }
@keyframes rise-in { from { opacity: 0; transform: translateY(14px); } }
.bloom__pic { position: relative; width: 100%; height: min(calc(var(--w) * 1.26), 38vh); }
.bloom__arch { position: absolute; left: 3%; right: 3%; bottom: 0; height: 80%; border-radius: calc(var(--w) * .47) calc(var(--w) * .47) 30px 30px; transition: transform .7s var(--ease), background .7s var(--ease);
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 52%, rgba(255, 255, 255, .34)) 0%, color-mix(in srgb, var(--c) 14%, rgba(255, 255, 255, .26)) 100%);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, .95), inset 0 0 0 1px rgba(255, 255, 255, .7), inset 0 0 26px rgba(255, 255, 255, .28); }
.bloom__look { position: absolute; left: 4%; bottom: 3.5%; width: 92%; height: 96.5%; border-radius: 40% 40% 26px 26px; cursor: zoom-in; }
.bloom__pic img { width: 100%; height: 100%; object-fit: contain; object-position: bottom; filter: drop-shadow(0 8px 9px rgba(58, 16, 48, .16)); transition: transform .9s var(--ease); transform-origin: 50% 100%; }
.bloom:hover .bloom__pic img { transform: translateY(-6px) rotate(-1.5deg) scale(1.03); }
.bloom:hover .bloom__arch { transform: scale(1.02); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 64%, rgba(255, 255, 255, .34)) 0%, color-mix(in srgb, var(--c) 22%, rgba(255, 255, 255, .3)) 100%); }
.bloom h3 { margin-top: 14px; font-family: var(--display); font-weight: 700; font-size: 1.36rem; line-height: 1.1; }
.bloom p { margin-top: 4px; font-size: .86rem; color: var(--ink-soft); line-height: 1.4; text-wrap: balance; min-height: 2.8em; }
.bloom__buy { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 8px; }
.bloom__price { font-weight: 600; font-size: 1.04rem; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.find { margin-top: 8px; padding: 3px 0; font-size: .82rem; font-weight: 500; color: var(--rose); background: linear-gradient(currentColor, currentColor) 50% 100% / 0 1px no-repeat; transition: background-size .5s var(--ease); }
.find:hover { background-size: 100% 1px; }
.reel__foot { display: flex; align-items: center; justify-content: center; padding: 6px 20px 26px; }
.reel__bar { position: relative; width: min(260px, 44vw); height: 2px; border-radius: 1px; background: rgba(255, 255, 255, .8); }
.reel__bar i { position: absolute; top: -.5px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, #EDB0C4, #B94F78); transition: left .15s linear; }


/* ---------- your basket: one pane of clear frosted glass, centred, the shop still there around it ---------- */
.bag { width: min(1000px, calc(100vw - 40px)); height: min(730px, calc(100vh - var(--top) - 20px)); }
.bag__x { position: absolute; top: 20px; right: 20px; z-index: 4; }
.bag__grid { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.14fr); }
.bag__show { display: grid; justify-items: center; align-content: center; text-align: center; padding: 30px 20px 30px 36px; }
.bag__show h2 { font-family: var(--display); font-weight: 500; font-size: clamp(2.2rem, 3.6vw, 3rem); line-height: 1; letter-spacing: -.015em; }
.bag__sub { margin: 8px 0 clamp(6px, 1.6vh, 16px); font-family: var(--display); font-style: italic; font-weight: 500; font-size: 1.1rem; color: var(--rose); }
.free { margin-top: 16px; width: min(260px, 80%); display: grid; gap: 8px; }
.free p { font-size: .84rem; font-weight: 500; color: var(--ink-soft); letter-spacing: .01em; }
.free__line { display: block; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, .8); }
.free__line i { display: block; height: 100%; border-radius: 1px; background: linear-gradient(90deg, #EDB0C4, #B94F78); transition: width .8s var(--ease); }
/* the form and the total never move; a long list of flowers scrolls on its own above them */
.bag__side { min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding: 70px 44px 28px 20px; }
.items { flex: 0 1 auto; min-height: 76px; overflow-y: auto; margin-right: -12px; padding-right: 12px; scrollbar-width: thin; scrollbar-color: rgba(58, 16, 48, .22) transparent; }
.items.is-more { -webkit-mask-image: linear-gradient(#000 calc(100% - 34px), transparent); mask-image: linear-gradient(#000 calc(100% - 34px), transparent); }
.send { flex: none; }
.row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto 60px; gap: 14px; align-items: center; padding: 8px 0; animation: rise-in .8s var(--ease) both; }
.row + .row { border-top: 1px solid rgba(255, 255, 255, .8); }
.row__img { width: 52px; height: 58px; background: radial-gradient(60% 54% at 50% 58%, color-mix(in srgb, var(--c) 60%, transparent) 0%, color-mix(in srgb, var(--c) 24%, transparent) 55%, transparent 76%); }
.row__img::after { display: none; }
.row__img img { position: absolute; left: 4%; bottom: 3%; width: 92%; height: 94%; filter: none; }
.row__text { min-width: 0; }
.row h3 { font-family: var(--display); font-weight: 700; font-size: 1.22rem; line-height: 1.15; }
.row p { font-size: .82rem; color: var(--ink-soft); line-height: 1.35; }
.row__price { font-size: .96rem; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.row .stepper button { width: 32px; height: 32px; }
.send { margin-top: clamp(14px, 3vh, 26px); }
.send h3 { font-family: var(--display); font-weight: 500; font-size: 1.5rem; line-height: 1.1; }
.send__two { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px; }
label { display: block; font-size: .8rem; font-weight: 500; color: var(--ink-soft); margin: 12px 0 5px 16px; letter-spacing: .01em; }
.input { width: 100%; min-height: 46px; border: 1px solid rgba(255, 255, 255, .85); border-radius: 999px; padding: 10px 18px; font-weight: 500; background: rgba(255, 255, 255, .42); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7); transition: background .3s, border-color .3s, box-shadow .3s; }
.input::placeholder { color: rgba(102, 80, 95, .62); }
textarea.input { border-radius: 24px; line-height: 1.4; resize: none; display: block; }
.input:focus { outline: 0; background: rgba(255, 255, 255, .72); border-color: rgba(169, 63, 102, .5); box-shadow: 0 0 0 4px rgba(255, 255, 255, .55); }
.input.is-bad { border-color: #A12B2B; background: rgba(255, 240, 238, .8); }
.err { color: #8C2222; font-size: .82rem; font-weight: 600; margin: 5px 0 0 16px; }
.pay { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: clamp(12px, 2.4vh, 20px); padding-top: clamp(12px, 2.4vh, 18px); border-top: 1px solid rgba(255, 255, 255, .85); }
.pay__total { display: grid; line-height: 1.1; }
.pay__total span { font-family: var(--display); font-style: italic; font-weight: 500; font-size: 1.05rem; color: var(--rose); }
.pay__total strong { font-weight: 600; font-size: 1.8rem; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.pay__total small { margin-top: 3px; font-size: .78rem; color: var(--ink-soft); }
.fine { font-size: .76rem; color: var(--ink-soft); margin-top: 12px; }

/* nothing in it yet, or just sent: a narrower pane, centred on the basket */
.bag.is-solo { width: min(520px, calc(100vw - 40px)); height: fit-content; max-height: calc(100vh - var(--top) - 20px); }
.bag.is-solo .bag__grid { grid-template-columns: minmax(0, 1fr); padding: 34px 30px 36px; height: auto; }
.bag.is-solo .bag__show { padding: 0; }
.bag.is-solo .bag__side { padding: 16px 0 0; overflow: visible; display: block; }
/* shorter windows: tighten first, and only then let the whole column scroll */
@media (max-height: 780px) { .bag__side { padding-top: 62px; padding-bottom: 20px; } .send { margin-top: 12px; } .send h3 { font-size: 1.35rem; } label { margin-top: 8px; } .input { min-height: 42px; padding-top: 8px; padding-bottom: 8px; } .pay { margin-top: 12px; padding-top: 10px; } .fine { margin-top: 8px; } .bq--big { width: min(250px, 23vw, 31vh); } .dress { margin-top: 6px; gap: 6px; } .free { margin-top: 12px; } }
@media (max-height: 640px) { .bag__side { display: block; overflow-y: auto; } .items { overflow: visible; margin: 0; padding: 0; } }
.bag.is-solo .bq--big { width: min(280px, 56vw, 34vh); }
.solo { text-align: center; display: grid; justify-items: center; }
.solo h3 { font-family: var(--display); font-weight: 500; font-size: 1.8rem; line-height: 1.12; text-wrap: balance; }
.solo p { margin-top: 8px; color: var(--ink-soft); }
.solo .btn { margin-top: 22px; }
.thanks__sign { font-family: var(--display); font-style: italic; font-weight: 500; font-size: 1.3rem; color: var(--rose) !important; margin-top: 12px; }

.petal-layer { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 40; pointer-events: none; }
.fly { position: fixed; z-index: 41; pointer-events: none; width: 110px; height: 130px; object-fit: contain; margin: -65px 0 0 -55px; will-change: transform, opacity; filter: drop-shadow(0 12px 14px rgba(74, 26, 52, .25)); }


@media (max-width: 820px) {
  :root { --bar: 66px; --pad: 12px; }
  .float { min-height: 44px; padding: 0 16px 0 13px; font-size: .9rem; }
  .float--basket { padding-right: 8px; }
  .corner { gap: 8px; }
  .hint { max-width: calc(100vw - 124px); border-radius: 22px; left: calc(50% + 26px); }
  .card { grid-template-columns: 92px minmax(0, 1fr); padding: 14px 16px 16px 8px; border-radius: 30px; }
  .card img { width: 92px; height: 116px; border-radius: 24px; }
  .glass { inset: var(--top) 10px 10px; border-radius: 30px; }
  body.has-pane .music, body.has-pane .finds { visibility: hidden; }
  .reel { width: auto; height: auto; }
  .reel__head { padding: 14px 14px 0 20px; }
  .reel__head h2 { font-size: 2rem; }
  .peek__label { display: none; }
  .bq--mini { width: 62px; }
  .reel__track { --w: min(62vw, 290px); gap: 24px; }
  .bloom__pic { height: min(calc(var(--w) * 1.2), 36vh); }
  .bag { width: auto; height: auto; }
  .bag__x { top: 14px; right: 14px; }
  .bag__grid { display: block; overflow-y: auto; padding: 0 18px; scrollbar-width: none; }
  .bag__grid::-webkit-scrollbar { display: none; }
  .bag__show { padding: 30px 0 0; }
  .bag__show h2 { font-size: 2.1rem; }
  .bq--big { width: min(220px, 56vw); }
  .note { right: -26%; }
  .bag__side { display: block; overflow: visible; padding: 22px 0 24px; }
  .items { overflow: visible; margin: 0; padding: 0; }
  .row { grid-template-columns: 50px minmax(0, 1fr) auto; gap: 0 12px; }
  .row__img { width: 50px; height: 58px; grid-row: 1 / 3; }
  .row .stepper { grid-row: 1 / 3; }
  .row__price { grid-column: 2; grid-row: 2; text-align: left; margin-top: 2px; }
  .send__two { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .pay { flex-wrap: wrap; }
  .pay .btn { flex: 1 1 auto; }
  .bag.is-solo { width: auto; height: fit-content; }
  .bag.is-solo .bag__grid { display: grid; padding: 30px 20px 30px; overflow: visible; }
}
@media (max-width: 360px) { .float span:not(.sr) { display: none; } .float { padding: 0 13px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
  .petal-layer { display: none; }
}


/* ================= v17: the close-up, saved flowers, filters, dressing, the card, charms, moods, greenhouse, the gift page ================= */

/* a heart: save a flower for later */
.heart { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--rose); z-index: 3; }
.heart svg { transition: transform .5s var(--ease); }
.heart[aria-pressed="true"] svg path { fill: currentColor; }
.heart[aria-pressed="true"] svg { animation: bump .6s var(--ease); }
.heart--lg { width: 50px; height: 50px; }
.bloom__pic .heart { position: absolute; right: 7%; top: 27%; opacity: .0; transform: scale(.9); transition: opacity .4s, transform .5s var(--ease); }
.bloom:hover .heart, .bloom:focus-within .heart, .bloom__pic .heart[aria-pressed="true"] { opacity: 1; transform: none; }
@media (hover: none) { .bloom__pic .heart { opacity: 1; transform: none; } }
.bloom__flag { position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); z-index: 3; padding: 1px 13px 2px; border-radius: 999px; white-space: nowrap; font-family: var(--display); font-style: italic; font-weight: 500; font-size: .92rem; color: var(--rose); background: rgba(255, 255, 255, .86); border: 1px solid #fff; }

/* text tabs: no boxes, a fine rose line under the one you chose */
.tabs { display: flex; align-items: baseline; gap: 2px 22px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; padding: 7px 0 6px; font-size: .92rem; font-weight: 500; color: var(--ink-soft); background: linear-gradient(var(--rose), var(--rose)) 50% 100% / 0 1.5px no-repeat; transition: background-size .5s var(--ease), color .3s; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-pressed="true"] { color: var(--ink); font-weight: 600; background-size: 100% 1.5px; }
.tabs b { font-weight: 600; font-size: .78rem; color: var(--rose); margin-left: 2px; }
.tabs__gap { flex: none; align-self: center; width: 1px; height: 15px; background: rgba(58, 16, 48, .2); }
.tabs__for { flex: none; font-family: var(--display); font-weight: 500; font-size: 1.05rem; color: var(--rose); margin-right: -8px; }
.tabs--mid { justify-content: center; gap: 2px 18px; }
.reel__filter { padding: 10px var(--gut) 0; min-width: 0; }
.reel__say { margin-top: 8px; font-size: .9rem; color: var(--ink-soft); animation: rise-in .6s var(--ease); }
.reel__say q { font-family: var(--display); font-style: italic; font-weight: 500; font-size: 1.08rem; color: var(--ink); quotes: '“' '”'; }
.reel__say .find { margin: 0 0 0 8px; }
.reel__empty { margin: auto; text-align: center; max-width: 34ch; animation: rise-in .7s var(--ease); }
.reel__empty h3 { font-family: var(--display); font-weight: 500; font-size: 1.8rem; }
.reel__empty p { margin-top: 8px; color: var(--ink-soft); }

/* dressing the bouquet, and the card tucked beside it */
.bag__stage { position: relative; }
.dress { margin-top: 12px; display: grid; gap: 9px; justify-items: center; max-width: 100%; }
.dress__row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px; }
.dress__set { display: inline-flex; align-items: center; gap: 7px; }
.dress__set em { font-family: var(--display); font-weight: 500; font-size: 1rem; color: var(--rose); margin-right: 2px; }
.dot { width: 21px; height: 21px; border-radius: 50%; background: var(--d); border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(58, 16, 48, .12); transition: transform .4s var(--ease), box-shadow .3s; }
.dot:hover { transform: scale(1.12); }
.dot[aria-pressed="true"] { box-shadow: 0 0 0 2px rgba(255, 255, 255, .95), 0 0 0 3.5px var(--rose); }
.note { position: absolute; right: -20%; bottom: 7%; z-index: 5; width: 48%; padding: 10px 12px 13px; border-radius: 5px; text-align: left; transform: rotate(6deg); transform-origin: 20% 100%;
  background: linear-gradient(160deg, #FFFEFA, #FBF0E7); box-shadow: 0 0 0 1px rgba(255, 255, 255, .9), 0 12px 22px -12px rgba(58, 16, 48, .55);
  font-family: 'La Belle Aurore', 'Segoe Script', 'Bradley Hand', 'Snell Roundhand', cursive; font-size: 1.02rem; line-height: 1.28; color: #4A2338; animation: note-in .8s var(--ease); }
@keyframes note-in { from { opacity: 0; transform: translateY(16px) rotate(0deg); } }
.note__to { display: block; }
.note__text { display: block; overflow-wrap: anywhere; }
.send__pic { display: block; margin: 7px 0 0 16px; }
.bq.is-bloom .bq__f { animation: bloom-in 1.3s var(--ease) both; animation-delay: calc(var(--i) * 130ms + 200ms); }
@keyframes bloom-in { from { opacity: 0; transform: translateY(34%) rotate(0deg) scale(.3); } 60% { opacity: 1; transform: rotate(calc(var(--r) * 1.15)) scale(1.08); } }
.thanks__act { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
.thanks__act .btn { margin-top: 0; }
.thanks .find { margin-top: 14px; }

/* the close-up: one flower, held near, and what there is to know about it */
.look { width: min(920px, calc(100vw - 40px)); height: fit-content; max-height: calc(100vh - var(--top) - 20px); overflow-y: auto; scrollbar-width: none; }
.look::-webkit-scrollbar { display: none; }
.look__x { position: absolute; top: 20px; right: 20px; z-index: 6; }
.look__grid { display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, 1fr); align-items: center; }
.look__stage { position: relative; height: min(540px, 64vh); display: grid; grid-template-rows: minmax(0, 1fr); place-items: end center; padding: 34px 24px 44px; perspective: 900px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.look__halo { position: absolute; inset: 9% 7% 7%; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--c, #F7C7D0) 58%, #fff) 0%, color-mix(in srgb, var(--c, #F7C7D0) 24%, transparent) 60%, transparent 100%); }
.look__stage img { position: relative; z-index: 1; height: 100%; width: auto; max-width: 100%; object-fit: contain; object-position: bottom; transform: rotateY(var(--ry, 0deg)) rotateX(var(--rx, 0deg)); transform-origin: 50% 92%; transition: transform .7s var(--ease); filter: drop-shadow(0 22px 22px rgba(74, 26, 52, .2)); pointer-events: none; }
.look__stage:not(.is-held) img { animation: turn 8s ease-in-out infinite; }
.look__stage.is-held img { transition: transform .14s linear; }
@keyframes turn { 0%, 100% { transform: rotateY(-17deg); } 50% { transform: rotateY(17deg); } }
.look__floor { position: absolute; left: 26%; right: 26%; bottom: 30px; height: 26px; border-radius: 50%; background: radial-gradient(closest-side, rgba(58, 16, 48, .2), rgba(58, 16, 48, 0)); }
.look__text { padding: 58px 50px 46px 8px; }
.look__flag { font-family: var(--display); font-style: italic; font-weight: 500; font-size: 1.08rem; color: var(--rose); margin-bottom: 6px; }
.look__text h2 { font-family: var(--display); font-weight: 500; font-size: clamp(2.3rem, 4vw, 3.2rem); line-height: 1; letter-spacing: -.015em; padding-right: 40px; }
.look__line { margin-top: 10px; font-size: 1.05rem; font-weight: 500; }
.facts { margin: 22px 0 24px; }
.facts div { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 14px; align-items: baseline; padding: 11px 0; border-top: 1px solid rgba(255, 255, 255, .9); }
.facts div:last-child { border-bottom: 1px solid rgba(255, 255, 255, .9); }
.facts dt { font-family: var(--display); font-style: italic; font-weight: 500; font-size: 1.08rem; color: var(--rose); }
.facts dd { font-size: .95rem; line-height: 1.45; }
.look__buy { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.look__buy .stepper button { width: 40px; height: 48px; }

/* bottom left: the four moods, above the music note */
.moods { position: absolute; left: var(--pad); bottom: calc(var(--pad) + 58px); z-index: 10; display: grid; min-width: 196px; padding: 8px; border-radius: 26px; box-shadow: var(--lift); animation: pop-in .5s var(--ease); }
@keyframes pop-in { from { opacity: 0; transform: translateY(10px) scale(.97); } }
.moods button { position: relative; text-align: left; padding: 10px 18px 10px 38px; border-radius: 999px; font-size: .93rem; font-weight: 500; color: var(--ink); transition: background .3s; }
.moods button:hover { background: rgba(255, 255, 255, .62); }
.moods button::before { content: ''; position: absolute; left: 16px; top: 50%; width: 9px; height: 9px; margin-top: -5px; border-radius: 50%; border: 1.4px solid var(--rose); transition: background .3s, box-shadow .3s; }
.moods button[aria-pressed="true"] { font-weight: 600; }
.moods button[aria-pressed="true"]::before { background: var(--rose); box-shadow: 0 0 0 3px rgba(169, 63, 102, .16); }
.moods .moods__pause { margin-top: 6px; padding: 12px 18px 8px; border-radius: 0 0 18px 18px; border-top: 1px solid rgba(255, 255, 255, .85); color: var(--rose); }
.moods .moods__pause::before { display: none; }
body.no-gl .moods { bottom: auto; top: calc(var(--pad) + 58px); }

/* bottom right: five charms, lit as you find them */
.finds { position: absolute; right: var(--pad); bottom: var(--pad); z-index: 8; display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 16px; border-radius: 999px; animation: fade .8s ease; transition: transform .5s var(--ease); }
.finds:hover { transform: translateY(-1px); }
.finds i { width: 13px; height: 13px; background: rgba(169, 63, 102, .24); clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); transition: background .6s, transform .6s var(--ease); }
.finds i.is-on { background: linear-gradient(135deg, #EFCB8A, #C8973F); transform: scale(1.25); }
.finds.is-bump { animation: bump .7s var(--ease); }

/* the greenhouse: in through the arched window, back by the button */
.doorspot--gh i::before { transform: rotate(-45deg); margin: -3px 0 0 -6px; }
.back { position: absolute; left: 50%; bottom: calc(var(--pad) + 4px); transform: translateX(-50%); z-index: 5; min-height: 46px; padding: 0 24px 0 18px; animation: fade .8s ease; }
.back:hover { transform: translate(-50%, -1px); }
.back:active { transform: translate(-50%, 0) scale(.985); }
.btn.back:hover svg { transform: translateX(-3px); }
body.in-gh .hint { bottom: calc(var(--pad) + 62px); }

/* the page a gift opens on */
.reveal { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; overflow-y: auto; padding: 22px 20px 30px; color: var(--plum);
  background: radial-gradient(90% 72% at 50% 42%, rgba(255, 251, 246, .97) 0%, rgba(251, 229, 226, .95) 58%, rgba(238, 204, 220, .95) 100%);
  -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); animation: fade .6s ease; }
.reveal__tag { flex: none; max-width: calc(100vw - 150px); padding: 8px 18px; border-radius: 999px; border: 1px solid #fff; background: rgba(255, 255, 255, .55); font-size: .84rem; font-weight: 500; color: var(--ink-soft); text-align: center; }
.reveal__x { position: absolute; top: 16px; right: 16px; }
.reveal__in { display: grid; justify-items: center; text-align: center; margin: auto 0; padding-top: 24px; }
.reveal__from { font-family: var(--display); font-weight: 700; font-size: 1.3rem; line-height: 1; }
.reveal__from em { font-weight: 500; font-size: 1rem; color: var(--rose); margin-left: 6px; }
.reveal h2 { margin-top: 14px; font-family: var(--display); font-weight: 500; font-size: clamp(2.6rem, 6vw, 4rem); line-height: 1; letter-spacing: -.015em; }
.reveal__sub { margin-top: 10px; min-height: 1.5em; max-width: 36ch; font-family: var(--display); font-style: italic; font-weight: 500; font-size: 1.15rem; line-height: 1.3; color: var(--rose); text-wrap: balance; }
.reveal__door { position: relative; margin-top: 24px; width: min(280px, 60vw, 38vh); aspect-ratio: 178 / 260; perspective: 1400px; transition: transform 1.8s var(--ease) .5s; }
.reveal__gift { position: absolute; inset: 0; display: grid; place-items: end center; border-radius: 8px; background: radial-gradient(70% 60% at 50% 52%, #FFF7E2 0%, #FBDDBE 68%, #F2C6AA 100%); transition: background 1.2s ease .6s, box-shadow 1.2s ease .6s; box-shadow: 0 30px 50px -30px rgba(58, 16, 48, .5); }
.reveal__gift .bq { width: 100%; }
.leaf { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 2; background: var(--img-door-jpg) 0 0 / 200% 100% no-repeat; transition: transform 1.7s cubic-bezier(.5, 0, .2, 1), opacity .8s ease 1.3s; }
.leaf--l { left: 0; transform-origin: 0 50%; border-radius: 8px 0 0 8px; }
.leaf--r { right: 0; background-position: 100% 0; transform-origin: 100% 50%; border-radius: 0 8px 8px 0; }
.reveal.is-open .leaf--l { transform: rotateY(-108deg); opacity: 0; }
.reveal.is-open .leaf--r { transform: rotateY(108deg); opacity: 0; }
.reveal.is-open .reveal__gift { background: radial-gradient(closest-side, rgba(255, 255, 255, .95) 0%, rgba(255, 244, 226, .5) 60%, rgba(255, 244, 226, 0) 100%); box-shadow: none; }
.reveal.is-open .reveal__door { transform: scale(1.1); }
.note--big { right: -56%; bottom: 4%; width: 80%; padding: 16px 18px 19px; font-size: 1.32rem; }
.reveal__act { margin-top: 30px; min-height: 54px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.reveal__fine { margin-top: 12px; max-width: 46ch; font-size: .8rem; color: var(--ink-soft); text-wrap: balance; overflow-wrap: anywhere; }

@media (max-width: 820px) {
  .reel__filter { padding: 8px 20px 0; }
  .look { width: auto; }
  .look__grid { grid-template-columns: minmax(0, 1fr); }
  .look__stage { height: 36vh; padding: 20px 20px 16px; }
  .look__text { padding: 0 22px 26px; }
  .look__text h2 { font-size: 2.2rem; padding-right: 0; }
  .facts div { grid-template-columns: 104px minmax(0, 1fr); padding: 9px 0; }

( function () {

	/**
 * Full-screen textured quad shader
 */
	var CopyShader = {
		uniforms: {
			'tDiffuse': {
				value: null
			},
			'opacity': {
				value: 1.0
			}
		},
		vertexShader:
  /* glsl */
  `

		varying vec2 vUv;

		void main() {

			vUv = uv;
			gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );

		}`,
		fragmentShader:
  /* glsl */
  `

		uniform float opacity;

		uniform sampler2D tDiffuse;

		varying vec2 vUv;

		void main() {

			vec4 texel = texture2D( tDiffuse, vUv );
			gl_FragColor = opacity * texel;

		}`
	};

	THREE.CopyShader = CopyShader;

} )();

</script>
